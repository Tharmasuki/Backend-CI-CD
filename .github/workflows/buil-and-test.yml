name: Backend application build and test
on:
  push:
    branches:
      - main

jobs:
  build-and-test-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout pannu
        uses:  actions/checkout@v7
      - name: code irukkutha?
        run: ls
      - name: java irukiya?
        run: java --version
      - name: mvn irukiya?
        run: mvn --version
      - name: build pannuvom
        run: mvn clean install -DskipTests=true
        working-directory: ./MediConnect
      - name: test pannuvom
        run: mvn test
        working-directory: ./MediConnect
      - name: docker image build
        run: docker build -t tharmasukijeyakumar/backendrepo
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKER_USER_NAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

